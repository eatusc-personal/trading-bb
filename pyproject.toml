# Ruff configuration for the Python backend. Deliberately minimal: the default
# rule set (pyflakes + core pycodestyle errors) with targeted ignores for
# patterns the codebase uses on purpose.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The backend modules share lexicons/env knobs via deliberate
# `from .config import *` imports (noqa'd F401/F403 at the import sites);
# F405 would otherwise flag every use of those names.
ignore = ["F405"]

[tool.ruff.lint.per-file-ignores]
# main.py sets up logging before its relative imports (E402). The modules
# below still carry imports kept for compatibility from the earlier
# decomposition of main.py (F401).
"python_api/main.py" = ["E402"]
"python_api/news.py" = ["F401"]
"python_api/providers.py" = ["F401"]
"python_api/social.py" = ["F401"]
"python_api/symbol_master.py" = ["F401"]
